name: Daily Auto Commit

on:
  schedule:
    # Runs every day at 00:00 UTC (Adjust as needed)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to trigger it manually for testing

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Make changes to a file
      run: |
        echo "Last automated commit: $(date)" > last_commit.txt

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add last_commit.txt
        git commit -m "chore: automated daily log update" || exit 0
        git push
